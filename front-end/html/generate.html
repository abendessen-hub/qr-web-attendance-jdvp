<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generate | JDVP Attendance</title>
<link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back" href="/front-end/html/home.html">Home</a>
    <h1>Generate QR codes</h1>
  </header>

  <!-- Register & Generate a single badge -->
  <section class="panel">
    <h2>Register a trainee</h2>
    <div class="row">
      <div>
        <label for="gen-qual">Qualification</label>
        <select id="gen-qual">
          <option value="1">Cookery</option>
          <option value="2">House Keeping</option>
          <option value="3">CSS</option>
          <option value="4">EIM</option>
          <option value="5">SMAW NC I</option>
          <option value="6">SMAW NC II</option>
        </select>
      </div>
      <div>
        <label for="gen-name">Full Name</label>
        <input id="gen-name" type="text" placeholder="Juan Dela Cruz">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Next ID</label>
        <input id="gen-id" type="text" readonly placeholder="Loading…">
      </div>
      <button class="btn" id="gen-submit" type="button">Register & Generate</button>
    </div>
    <div class="preview" id="gen-preview"></div>
    <button class="btn ghost" id="gen-download" type="button" disabled>Download PNG</button>
    <p class="hint" id="gen-status"></p>
  </section>

  <!-- Registered trainees & batch reprint -->
  <section class="panel">
    <h2>Registered trainees</h2>
    <div class="row">
      <div>
        <label for="list-qual">Filter by qualification</label>
        <select id="list-qual">
          <option value="">All</option>
          <option value="Cookery">Cookery</option>
          <option value="House Keeping">House Keeping</option>
          <option value="CSS">CSS</option>
          <option value="EIM">EIM</option>
          <option value="SMAW NC I">SMAW NC I</option>
          <option value="SMAW NC II">SMAW NC II</option>
        </select>
      </div>
      <button class="btn" id="load-trainees" type="button">Load</button>
      <button class="btn ghost" id="print-badges" type="button" disabled>Print all badges</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Trainee ID</th><th>Name</th><th>Qualification</th><th></th></tr>
        </thead>
        <tbody id="trainees-body"></tbody>
      </table>
      <div id="trainees-msg" role="status"></div>
    </div>
  </section>

  <!-- Print grid (hidden on screen, visible in print) -->
  <div id="grid" aria-label="Generated QR badges"></div>
</main>

<script src="/back-end/js/authenticate.js"></script>
<script src="/back-end/lib/qrcode.min.js"></script>
<script src="/back-end/lib/jszip.min.js"></script>
<script src="/back-end/js/config.js"></script>
<script src="/back-end/js/generate.js"></script>

</body>
</html>
