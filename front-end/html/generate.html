<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generate QR | JDVP Monitoring Track</title>
<link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="back" href="/home">Home</a>
    <h1>Generate QR codes</h1>
  </header>

  <section class="panel">
    <label for="qualification-select">Qualification</label>
    <select id="qualification-select" disabled>
      <option value="">Select a qualification</option>
      <option value="1">Cookery</option>
      <option value="2">House Keeping</option>
      <option value="3">CSS</option>
      <option value="4">EIM</option>
      <option value="5">SMAW NC II</option>
      <option value="6">SMAW NC III</option>
    </select>
  </section>

  <!-- Option 1: One student -->
  <section class="panel">
    <h2>One student</h2>
    <div class="row">
      <div>
        <label for="single-id">Student ID (4 digits)</label>
        <input id="single-id" type="text" inputmode="numeric" maxlength="4" placeholder="0001">
      </div>
      <button class="btn" id="single-make" type="button">Generate</button>
    </div>
    <div class="preview" id="single-preview"></div>
    <button class="btn ghost" id="single-download" type="button" disabled>Download PNG</button>
  </section>

  <!-- Option 2: A range of students -->
  <section class="panel">
    <h2>A range of students</h2>
    <div class="row">
      <div>
        <label for="range-from">From</label>
        <input id="range-from" type="text" inputmode="numeric" maxlength="4" value="0001">
      </div>
      <div>
        <label for="range-to">To</label>
        <input id="range-to" type="text" inputmode="numeric" maxlength="4" value="0400">
      </div>
    </div>
    <div class="row">
      <button class="btn" id="range-make" type="button">Generate range</button>
      <button class="btn ghost" id="range-zip" type="button" disabled>Download ZIP</button>
      <button class="btn ghost" id="range-print" type="button" disabled>Print sheet (A4)</button>
    </div>
    <div id="progress" aria-hidden="true"><div></div></div>
    <p class="hint" id="range-status">Each ZIP file holds one labeled PNG per badge (e.g. 0001.png). The print sheet fits 9 badges per standard A4 page (3x3 grid).</p>
  </section>

  <!-- Grid of generated QR cards for screen preview and A4 printing -->
  <div id="grid" aria-label="Generated QR codes"></div>
</main>

<script src="/back-end/js/authenticate.js"></script>
<script src="/back-end/lib/qrcode.min.js"></script>
<script src="/back-end/lib/jszip.min.js"></script>
<script src="/back-end/js/config.js"></script>
<script src="/back-end/js/generate.js"></script>
</body>
</html>
