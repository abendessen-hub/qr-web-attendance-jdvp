<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JDVP Monitoring Track</title>
<link rel="stylesheet" href="front-end/css/style.css">
</head>
<body>
<main class="wrap">
  <div class="auth-shell">
    <section class="brand-panel" aria-label="JDVP monitor overview">
      <img class="brand-badge" src="/assets/company_logo.jpg" alt="Company logo"></img>
      <p class="eyebrow">JDVP A.I.M.S</p>
      <h1>Joint Delivery Voucher Program</h1>
      <p>Attendance Information and Monitoring System</p>
      <ul class="feature-list">
        <li>Live QR scanning</li>
        <li>Qualification-based access</li>
        <li>Attendance progress tracking</li>
      </ul>
    </section>

    <section class="login-panel panel" aria-label="Operator login">
      <div class="panel-header">
        <p class="eyebrow">Operator access</p>
        <h2>Sign in</h2>
      </div>
      <form id="login-form" autocomplete="off" novalidate>
        <div class="row">
          <div>
            <label for="username-input">Username</label>
            <input id="username-input" type="text" placeholder="1trainee2026" required>
          </div>
        </div>
        <div class="row">
          <div>
            <label for="password-input">Password</label>
            <input id="password-input" type="password" placeholder="••••" required>
          </div>
        </div>
        <div class="row">
          <button class="btn" type="submit">Enter</button>
        </div>
      </form>
      <p class="hint">Enter your assigned operator username and password.</p>
    </section>
  </div>

  <div id="form-toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true"></div>
</main>
<script src="back-end/js/login.js"></script>
</body>
</html>
