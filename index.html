<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JDVP Attendance</title>
<link rel="stylesheet" href="/front-end/css/style.css">
</head>
<body>
<main class="wrap">
  <div class="hero">
    <h1>JDVP Attendance</h1>
    <p>Luis Y. Ferrer Jr. Senior High School</p>
  </div>

  <section class="panel">
    <form id="login-form" autocomplete="off">
      <div class="row">
        <div>
          <label for="username-input">Username</label>
          <input id="username-input" type="text" placeholder="1trainee2026">
        </div>
        <div>
          <label for="password-input">Password</label>
          <input id="password-input" type="password" placeholder="••••">
        </div>
        <button class="btn" type="submit">Enter</button>
      </div>
    </form>
    <p class="hint">Enter your assigned username and password to access the system.</p>
  </section>
</main>
<script src="/back-end/js/login.js"></script>
</body>
</html>
